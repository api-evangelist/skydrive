aid: skydrive
name: SkyDrive
description: >-
  SkyDrive Inc. is a Japanese advanced air mobility manufacturer, founded in July 2018 by
  members of the CARTIVATOR volunteer project, that develops, manufactures, sells and operates
  eVTOL (electric vertical take-off and landing) aircraft. Its flagship aircraft, SKYDRIVE
  (model SD-05), is a compact three-seat electric aircraft in type certification with the Japan
  Civil Aviation Bureau and in concurrent validation with the US Federal Aviation Administration,
  and is produced with official manufacturing partner Suzuki Motor Corporation at Suzuki's plant
  in Iwata, Shizuoka. The company is headquartered in Toyota City, Aichi, with offices in Tokyo,
  Nagoya, Osaka and Yamaguchi and a US subsidiary, SkyDrive America. SkyDrive is a hardware and
  aircraft-operations company; it publishes no public developer program, API, SDK or
  machine-readable interface contract of any kind.
